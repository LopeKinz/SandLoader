name: Mod compatibility report
description: Report a SandLoader or Fluxloader mod that does not load or behave correctly
title: "[Mod Compatibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this template when a specific mod works differently under SandLoader, does not load, or reports as enabled without actually running.

        Please attach the SandLoader log from `<userData>/smln/logs/` whenever possible.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this mod or the same error.
          required: true
        - label: I tested the mod with the latest SandLoader version available to me.
          required: true
        - label: I have removed secrets or other sensitive information from any attached logs.
          required: true

  - type: input
    id: mod_name
    attributes:
      label: Mod name
      placeholder: e.g. Example Mod
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: Mod version
      placeholder: e.g. 1.4.2
    validations:
      required: false

  - type: dropdown
    id: mod_type
    attributes:
      label: Mod type
      options:
        - SandLoader mod
        - Fluxloader mod
        - Steam Workshop mod
        - Unknown / other
    validations:
      required: true

  - type: input
    id: mod_source
    attributes:
      label: Mod source
      description: Link to the mod repository, Workshop page, release, or download page if public.
      placeholder: https://...
    validations:
      required: false

  - type: textarea
    id: behavior
    attributes:
      label: What goes wrong?
      description: Describe exactly what SandLoader shows and what the mod actually does.
      placeholder: The mod is shown as enabled, but...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install the mod
        2. Enable it in SandLoader Mods
        3. Restart Sandustry
        4. ...
    validations:
      required: true

  - type: input
    id: sandloader_version
    attributes:
      label: SandLoader version / commit
      placeholder: e.g. v0.2.0 or abc1234
    validations:
      required: true

  - type: input
    id: sandustry_version
    attributes:
      label: Sandustry version
      placeholder: e.g. 0.5.4
    validations:
      required: true

  - type: dropdown
    id: store
    attributes:
      label: Game store / distribution
      options:
        - Steam
        - GOG
        - Manual / standalone
        - Microsoft Store
        - Game Pass
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: other_mods
    attributes:
      label: Other enabled mods
      description: List other enabled mods, or say `None`.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: SandLoader log
      description: Drag and drop the relevant `smln-*.log` file here, or paste the relevant section.
      placeholder: Attach the log file here.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include screenshots, console output, manifest details, or anything else that may be relevant.
    validations:
      required: false
